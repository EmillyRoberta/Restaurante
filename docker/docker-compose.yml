services:
  db:
    image: postgres:18.4
    container_name: db-postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PWD}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 50s
      timeout: 5s
      retries: 5
      start_period: 7s
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    container_name: backend-restaurante
    build:
      context: ./application/restaurante
      no_cache: true
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker #indicates to use the application-docker.properties settings
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: